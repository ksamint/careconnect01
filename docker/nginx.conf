# The production listener is reachable through the existing trusted Traefik route.
# Traefik appends the actual peer; ignore any untrusted earlier forwarded entries.
map $http_x_forwarded_for $careconnect_client_ip {
    default $remote_addr;
    "~(?<careconnect_last_ip>[^,\s]+)$" $careconnect_last_ip;
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log off;
    client_max_body_size 64k;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 256;

    location /api/ {
        proxy_pass http://careconnect-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Careconnect-Client-IP $careconnect_client_ip;
        proxy_read_timeout 30s;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        try_files $uri =404;
    }
    add_header Cache-Control "no-store" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
