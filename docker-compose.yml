services:
  careconnect:
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    image: careconnect:latest
    container_name: careconnect
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      - TZ=Asia/Shanghai
      # Initial passwords, used only when the database is first created. Change them in the admin console afterwards.
      - DEFAULT_PASSWORD=${DEFAULT_PASSWORD:-123456a}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # Set to 0 to start without the DEMO- training participants.
      - SEED_DEMO=${SEED_DEMO:-1}
    volumes:
      # SQLite database + daily backups (data/backups). Copy out with: docker compose cp careconnect:/data ./careconnect-backup
      - careconnect-data:/data

volumes:
  careconnect-data:
    name: careconnect-data
